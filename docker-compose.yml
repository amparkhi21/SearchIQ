name: searchiq

services:
  mongo:
    image: mongo:7.0
    container_name: searchiq-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: searchiq-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: searchiq-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=searchiq-cluster
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  ai-service:
    build:
      context: ./ai-service
    container_name: searchiq-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      AI_PORT: "8000"
      AI_INTERNAL_KEY: dev-only-ai-key-change-me-0123456789abcdef
      MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_VERSION: minilm-v1
      EMBEDDING_DIMENSIONS: "384"
      MAX_PRODUCT_BATCH: "64"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).read()"
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 120s

  # Optional: run the backend inside Docker too.
  # Start with: docker compose --profile app up --build -d
  backend:
    build:
      context: ./backend
    container_name: searchiq-backend
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/searchiq
      REDIS_URL: redis://redis:6379
      OPENSEARCH_NODE: http://opensearch:9200
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_KEY: dev-only-ai-key-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      LOG_TO_FILE: "false"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/src/uploads

volumes:
  mongo_data:
  redis_data:
  opensearch_data:
  backend_uploads:
